<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Login Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Background fade-in animation */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('HTML IMAGES/kitchenbg.jpg'); 
            background-size: cover;
            background-position: center;
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Login Box (blurred + glass effect) */
        .login-container {
            width: 330px;
            padding: 25px;
            border-radius: 15px;

            /* Glassmorphism Blur */
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.18);
            
            box-shadow: 0px 10px 35px rgba(0,0,0,0.5);
            animation: slideUp 1.2s ease;

            /* Decorative food-themed background */
            background-image: url('HTML IMAGES/DBG.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-blend-mode: overlay;
        }

        /* Slide-up animation */
        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Title */
        h2 {
            text-align: center;
            color: white;
            font-size: 30px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 6px black;
        }

        /* Inputs */
        input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.85);
            font-size: 15px;
            transition: 0.25s;
        }

        /* Input glow animation */
        input:focus {
            transform: scale(1.04);
            box-shadow: 0 0 12px orange;
        }

        /* Login Button */
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: orange;
            color: white;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        /* Button hover animation */
        button:hover {
            background: rgb(255, 140, 0);
            transform: scale(1.07);
            box-shadow: 0 0 12px rgb(255, 140, 0);
        }

        /* Bottom text */
        p {
            margin-top: 15px;
            text-align: center;
            color: white;
            font-size: 15px;
            text-shadow: 1px 1px 4px black;
        }

        /* Link */
        a {
            color: yellow;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            color: white;
            text-decoration: underline;
        }

    </style>
</head>


<body style="background-image: url('HTML IMAGES/DBG.jpg'); background-size:cover; background-repeat: no-repeat;">

    <div class="login-container">

        <h2>Login</h2>

        <form action="intro.html">
            <input type="text" placeholder="Enter your username" required>
            <input type="password" placeholder="Enter your password" required>
            <button type="submit">Login</button>
        </form>

        <p>Don't have an account? <a href="Create Account.html">Create Account</a></p>

    </div>

</body>
</html>
