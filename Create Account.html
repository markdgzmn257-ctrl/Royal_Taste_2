<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-image: url('HTML IMAGES/DBG.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            /* Background fade animation */
            animation: fadeIn 1.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Blurred Food Login Box */
        .form-container {
            width: 330px;
            padding: 25px;
            border-radius: 15px;

            /* Glass blur effect */
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.18);

            box-shadow: 0 10px 35px rgba(0,0,0,0.5);

            /* Slide Up Animation */
            animation: slideUp 1.2s ease;

            background-image: url('HTML IMAGES/DBG.jpg');
            background-size: cover;
            background-blend-mode: overlay;
        }

        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        h2 {
            text-align: center;
            color: white;
            margin-bottom: 15px;
            font-size: 28px;
            text-shadow: 2px 2px 4px black;
        }

        .form-group {
            margin-bottom: 1em;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: none;
            background: rgba(255,255,255,0.9);
            font-size: 16px;
            outline: none;
            transition: .3s;
        }

        /* Input glow animation */
        input:focus {
            transform: scale(1.05);
            box-shadow: 0 0 12px orange;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: orange;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            transform: scale(1.07);
            background: rgb(255, 136, 0);
            box-shadow: 0 0 12px rgb(255, 136, 0);
        }

        .message {
            margin-top: 12px;
            color: white;
            text-align: center;
            text-shadow: 1px 1px 3px black;
        }

        .message a {
            color: yellow;
            font-weight: bold;
            text-decoration: none;
        }

        .message a:hover {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h2>Create Account</h2>

        <form id="createAccountForm" action="Log in Form.html">
            <div class="form-group">
                <input type="text" id="username" placeholder="Enter your Username" required>
            </div>

            <div class="form-group">
                <input type="email" id="email" placeholder="Enter your Email" required>
            </div>

            <div class="form-group">
                <input type="password" id="password" placeholder="Enter your Password" required>
            </div>

            <div class="form-group">
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
            </div>

            <button type="submit">Create Account</button>
        </form>

        <div class="message">
            Already have an account? <a href="Log in Form.html">Login</a>
        </div>
    </div>

    <script>
        document.getElementById("createAccountForm").addEventListener("submit", function(event) {
            const pass = document.getElementById("password").value;
            const confirm = document.getElementById("confirmPassword").value;

            if (pass !== confirm) {
                event.preventDefault();
                alert("Passwords do not match!");
            }
        });
    </script>

</body>
</html>
