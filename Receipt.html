<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Receipt</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-image: url('HTML IMAGES/DBG.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Smooth fade + slide animation */
        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Receipt box with blur effect */
        .receipt {
            width: 320px;
            padding: 20px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.4);
            color: white;
            animation: fadeSlide 1s ease-out;
        }

        /* Title */
        h1 {
            text-align: center;
            margin-top: 0;
            font-size: 28px;
            color: #ffebcd;
            text-shadow: 2px 2px 5px black;
        }

        /* List styling */
        ul {
            padding-left: 18px;
        }

        /* Button animation */
        button {
      background-color: orange;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      width: 90%;
      margin-top: 10px;
      transition: 0.3s ease-in-out;
    }
    button:hover {
      background-color: gold;
      color: black;
      transform: scale(1.09);
      box-shadow: 0 0 15px white;
    }
    .nav-bar {
      display: flex;
      justify-content: center;
      gap: 1em;
      padding: 0.8em;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }
    .nav-bar button {
      background: orange;
      color: black;
      padding: 00.6em 1.2em;
      border: none;
      border-radius: 20px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .nav-bar button:hover {
      background: gold;
      transform: scale(1.1);
    }

        /* Hover glow animation */
        button:hover {
            background: #45a049;
            box-shadow: 0 0 10px #45a049, 0 0 20px #45a049;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    
    
    
    <div class="nav-bar">
    <form action="menu.html"><button type="submit">MENU</button></form>
    <form action="Carts.html"><button type="submit">CART</button></form>
    <form action="Checkout.html"><button type="submit">CHECKOUT</button></form>
    
  </div>
    
    
    
    
    
    <div class="receipt">
        <h1>Receipt</h1>
        <p><b>Name:</b> <span id="receiptName"></span></p>
        <p><b>Phone:</b> <span id="receiptPhone"></span></p>
        <p><b>Address:</b> <span id="receiptAddress"></span></p>
        <p><b>Payment Method:</b> <span id="receiptPaymentMethod"></span></p>
        <p><b>Account Name:</b> <span id="receiptAccountName"></span></p>
        <p><b>Account Number:</b> <span id="receiptAccountNumber"></span></p>
        <p><b>Date/Time:</b> <span id="receiptDate"></span></p>
        <h3>Ordered Items:</h3>
        <ul id="receiptItems"></ul>
        <p><b>Total:</b> ₱<span id="receiptTotal"></span></p>
        <p><b>Amount Paid:</b> ₱<span id="receiptAmountPaid"></span></p>
        <p><b>₱<span id="receiptAmountPaidValue"></span> - ₱<span id="receiptTotalValue"></span> = ₱<span id="receiptChange"></span></b></p>
        <p style="text-align:center;">Thank you for ordering!</p>
        <form action="Menu.html">
            <button>OK</button>
        </form>
    </div>
    <script>
        let orderData = JSON.parse(localStorage.getItem('orderData'));
        if (orderData) {
            document.getElementById('receiptName').textContent = orderData.customerName;
            document.getElementById('receiptPhone').textContent = orderData.customerPhone;
            document.getElementById('receiptAddress').textContent = orderData.customerAddress;
            document.getElementById('receiptPaymentMethod').textContent = orderData.paymentMethod;
            document.getElementById('receiptAccountName').textContent = orderData.accountName;
            document.getElementById('receiptAccountNumber').textContent = orderData.accountNumber;
            document.getElementById('receiptDate').textContent = orderData.date;
            let itemsHtml = '';
            let total = 0;
            orderData.items.forEach(item => {
                itemsHtml += `<li>${item.name} (Qty: ${item.qty}) - ₱${item.price * item.qty}</li>`;
                total += item.price * item.qty;
            });
            document.getElementById('receiptItems').innerHTML = itemsHtml;
            document.getElementById('receiptTotal').textContent = total.toFixed(2);
            document.getElementById('receiptTotalValue').textContent = total.toFixed(2);
            document.getElementById('receiptAmountPaid').textContent = orderData.amountPaid;
            document.getElementById('receiptAmountPaidValue').textContent = orderData.amountPaid;
            let change = orderData.amountPaid - total;
            document.getElementById('receiptChange').textContent = change.toFixed(2);
        }
    </script>
</body>

</html>
